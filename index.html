<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- the Bootstrap CSS file 
     ... cdn stand for content delivery network -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Bootstrap Stuff</title>
</head>
<body>
    <!-- bootstrap work by adding classes to HTML
     for example, break points (xs, s, m, lg, xl, 2xl) 
     backgrounds (bg) 
     foregrounds (fg) - for text -->
    <div class="lg:container bg-primary fg-contrast-primary">
        <header>
            <h1>New Bootstrap 6!</h1>
        </header>

        <main>
            <!-- try a bootstrap component - a "drawer" - by
             copying the code from bootstrap and tweaking it...
             https://getbootstrap.com/docs/6.0/components/drawer/ -->
            <button type="button" class="btn-solid theme-accent" commandfor="invokerDrawer" command="show-modal">
                Open drawer
            </button>

            <dialog class="drawer drawer-start" tabindex="-1" id="invokerDrawer" aria-labelledby="invokerDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="invokerDrawerLabel">Invoker Commands</h5>
                    <button type="button" class="btn-close" commandfor="invokerDrawer" command="close" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <p>This drawer opens with <code>command="show-modal"</code> and closes with <code>command="close"</code>. No Bootstrap JavaScript is involved.</p>
                    <form>
                        <div class="form-field">
                            <input type="checkbox" id="checksuccess" class="check theme-success" checked />
                            <label for="checksuccess">Example success checkbox</label>
                        </div>
                    </form>
                </div>
            </dialog>

            <form>
                <div class="form-field">
                    <input type="checkbox" id="checksuccess" class="check theme-success" checked />
                    <label for="checksuccess">Example success checkbox</label>
                </div>
                <div class="form-field">
                    <label for="fieldText" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="fieldText" placeholder="name@example.com">
                    <div class="form-text">
                        We'll never share your email with anyone else.
                    </div>
                </div>
            </form>
        </main>

        

        <section>
            <!-- bootstrap's grid! 
             the grid is a  12-col grid (which you can set columns
             to be different sizes around) 
             p-3 is padding - 0.5em - you can have padding classes
             and margin classes (ie. m-8) -->
            <div class="row bg-danger fg-contrast-danger">
                <div class="md:col-8 p-3">1 column</div>
                <div class="sm:col p-3">2 column</div>
                <div class="sm:col p-3">3 column</div>
            </div>
        </section>
    </div>





    <!-- bootstrap javascript file -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
